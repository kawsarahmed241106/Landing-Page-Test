name: Deploy UddoktaPay Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/uddoktapay/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-uddoktapay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy UddoktaPay function
        run: supabase functions deploy uddoktapay --project-ref "$SUPABASE_PROJECT_ID"
